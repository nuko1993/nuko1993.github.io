<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个简单的开始。helloword。">
  <title>helloword</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #111312; color: #f3f3e9; }
    main { width: min(100%, 1100px); padding: 48px 24px; text-align: center; }
    .label { display: inline-flex; align-items: center; gap: 9px; font: 12px ui-monospace, monospace; letter-spacing: .16em; color: #a5b1a3; }
    .dot { width: 7px; height: 7px; background: #bcf574; border-radius: 50%; box-shadow: 0 0 18px #bcf57455; }
    h1 { margin: 30px 0 20px; font-size: clamp(48px, 14vw, 150px); font-weight: 600; letter-spacing: -.07em; line-height: 1.1; }
    h1 span { color: #bcf574; }
    p { margin: 0; font-size: 15px; line-height: 1.8; color: #9ca39b; }
    footer { margin-top: 64px; font: 11px ui-monospace, monospace; color: #727b70; letter-spacing: .12em; }
    ::selection { background: #bcf574; color: #111312; }
  </style>
</head>
<body>
  <main>
    <div class="label"><span class="dot" aria-hidden="true"></span> A SIMPLE BEGINNING</div>
    <h1>helloword<span>.</span></h1>
    <p>你好，世界。一个简单的开始。</p>
    <footer>BUILT WITH CURIOSITY · HOSTED ON GITHUB PAGES</footer>
  </main>
</body>
</html>
